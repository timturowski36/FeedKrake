services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public]
    depends_on: [noonoo-web]

  noonoo-web:
    image: ghcr.io/${GITHUB_USERNAME}/noonoo-web:latest
    restart: unless-stopped
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: "8080"
      DOMAIN: ${DOMAIN}
      # Je einmalig per `openssl rand -hex 32` erzeugen und dauerhaft in .env halten —
      # ein Wechsel invalidiert alle bestehenden Sessions.
      SESSION_ENCRYPT_KEY: ${SESSION_ENCRYPT_KEY}
      SESSION_SIGN_KEY: ${SESSION_SIGN_KEY}
      # Google-Cloud-Projekt (Consent-Screen, Scope drive.file) + `openssl rand -hex 32`
      # fuer TOKEN_ENC_KEY — siehe docs/noonoo-aenderungsplan-2.md Punkt 4.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY}
    networks: [public, internal]
    depends_on:
      postgres:
        condition: service_healthy

  noonoo-aggregator:
    image: ghcr.io/${GITHUB_USERNAME}/noonoo-aggregator:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks: [public, internal]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    # KEIN ports:-Mapping! Postgres bleibt intern.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup --api-version 1.40
    # public ist zwingend: Watchtower muss die Registry erreichen. Am reinen
    # internal-Netz (internal: true) gibt es keinen Egress — dort scheitert
    # jeder Pull an der Namensauflösung.
    networks: [internal, public]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  public:
  internal:
    internal: true
