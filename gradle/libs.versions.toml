[versions]
kotlin           = "2.3.0"
coroutines       = "1.9.0"
serialization    = "1.7.0"
kotlinx-datetime = "0.6.1"
ktor             = "3.4.2"
koin             = "4.1.1"
exposed          = "0.57.0"
postgresql       = "42.7.5"
hikari           = "6.3.0"
flyway           = "11.8.0"
duckdb           = "1.5.1.0"
jda              = "5.3.0"
discord-webhooks = "0.8.4"
dotenv           = "6.5.1"
jsoup            = "1.22.1"
playwright       = "1.48.0"
anthropic        = "2.19.0"
kaml             = "0.65.0"
logback          = "1.5.6"
kotlin-logging   = "7.0.0"

[libraries]
# kotlinx
kotlinx-coroutines        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",       version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",   version.ref = "serialization" }
kotlinx-datetime          = { module = "org.jetbrains.kotlinx:kotlinx-datetime",              version.ref = "kotlinx-datetime" }

# Ktor Client
ktor-client-core                  = { module = "io.ktor:ktor-client-core",                  version.ref = "ktor" }
ktor-client-cio                   = { module = "io.ktor:ktor-client-cio",                   version.ref = "ktor" }
ktor-client-content-negotiation   = { module = "io.ktor:ktor-client-content-negotiation",   version.ref = "ktor" }
ktor-client-logging               = { module = "io.ktor:ktor-client-logging",               version.ref = "ktor" }
ktor-serialization-kotlinx-json   = { module = "io.ktor:ktor-serialization-kotlinx-json",   version.ref = "ktor" }

# Ktor Server (für :web)
ktor-server-core                  = { module = "io.ktor:ktor-server-core",                  version.ref = "ktor" }
ktor-server-netty                 = { module = "io.ktor:ktor-server-netty",                 version.ref = "ktor" }
ktor-server-sse                   = { module = "io.ktor:ktor-server-sse",                   version.ref = "ktor" }
ktor-server-content-negotiation   = { module = "io.ktor:ktor-server-content-negotiation",   version.ref = "ktor" }
ktor-server-call-logging          = { module = "io.ktor:ktor-server-call-logging",          version.ref = "ktor" }
ktor-server-status-pages          = { module = "io.ktor:ktor-server-status-pages",          version.ref = "ktor" }
ktor-server-cors                  = { module = "io.ktor:ktor-server-cors",                  version.ref = "ktor" }

# Exposed (ORM für PostgreSQL)
exposed-core             = { module = "org.jetbrains.exposed:exposed-core",             version.ref = "exposed" }
exposed-jdbc             = { module = "org.jetbrains.exposed:exposed-jdbc",             version.ref = "exposed" }
exposed-kotlin-datetime  = { module = "org.jetbrains.exposed:exposed-kotlin-datetime",  version.ref = "exposed" }

# Datenbank
postgresql   = { module = "org.postgresql:postgresql",             version.ref = "postgresql" }
hikari       = { module = "com.zaxxer:HikariCP",                   version.ref = "hikari" }
flyway-core  = { module = "org.flywaydb:flyway-core",              version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
duckdb-jdbc  = { module = "org.duckdb:duckdb_jdbc",                version.ref = "duckdb" }

# Discord / Bot
koin-core        = { module = "io.insert-koin:koin-core",              version.ref = "koin" }
discord-webhooks = { module = "club.minnced:discord-webhooks",         version.ref = "discord-webhooks" }
jda              = { module = "net.dv8tion:JDA",                       version.ref = "jda" }

# Sonstige
dotenv-kotlin  = { module = "io.github.cdimascio:dotenv-kotlin",       version.ref = "dotenv" }
jsoup          = { module = "org.jsoup:jsoup",                         version.ref = "jsoup" }
playwright     = { module = "com.microsoft.playwright:playwright",     version.ref = "playwright" }
anthropic-java = { module = "com.anthropic:anthropic-java",            version.ref = "anthropic" }
kaml           = { module = "com.charleskorn.kaml:kaml",               version.ref = "kaml" }
logback        = { module = "ch.qos.logback:logback-classic",          version.ref = "logback" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm",     version.ref = "kotlin-logging" }
