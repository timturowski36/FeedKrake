modules:
  - id: bundesliga_1
    type: football
    enabled: true
    source: openligadb
    config:
      league: bl1
      season: 2025
    schedule:
      fetchIntervalMinutes: 15
    outputs: []

  - id: heise_tech
    type: news
    enabled: true
    source: rss
    config:
      url: "https://www.heise.de/rss/heise-atom.xml"
      sourceName: "Heise Online"
    schedule:
      fetchIntervalMinutes: 60
    outputs: []

  - id: tagesschau
    type: news
    enabled: true
    source: rss
    config:
      url: "https://www.tagesschau.de/xml/rss2/"
      sourceName: "Tagesschau"
    schedule:
      fetchIntervalMinutes: 30
    outputs: []

  - id: pubg_friends
    type: pubg
    enabled: true
    source: pubg_api
    config:
      platform: steam  # steam | xbox | psn
    players:
      - "brotrustgaming"
      - "philipnc"
      - "Alxndr_D"
      - "Libaty"
    accountIds:
      - "account.af4b877b95df46a3804d38d8be1d3225"
    schedule:
      fetchIntervalMinutes: 30
    outputs:
      # Tagesstatistik – täglich um 09:00
      - type: discord
        channel: gaming
        schedule: DAILY_09_00
        format: pubg_daily_stats

      # Tagesstatistik – allgemein-Kanal
      - type: discord
        channel: allgemein
        schedule: DAILY_09_00
        format: pubg_daily_stats

      # Wochenstatistik – montags um 09:00
      - type: discord
        channel: gaming
        schedule: WEEKLY_MONDAY_09_00
        format: pubg_weekly_stats

      # Wochenranking – montags um 09:15
      - type: discord
        channel: gaming
        schedule: WEEKLY_MONDAY_09_15
        format: pubg_weekly_ranking

      # Wochenvergleich – montags um 09:30
      - type: discord
        channel: gaming
        schedule: WEEKLY_MONDAY_09_30
        format: pubg_weekly_progress

      # Persönliche Rekorde – montags um 10:00
      - type: discord
        channel: gaming
        schedule: WEEKLY_MONDAY_10_00
        format: pubg_records

      # Letzte Matches – montags um 10:15
      - type: discord
        channel: gaming
        schedule: WEEKLY_MONDAY_10_15
        format: pubg_recent_matches
        params:
          limit: "5"

      # Map-Statistiken – montags um 10:30
      - type: discord
        channel: gaming
        schedule: WEEKLY_MONDAY_10_30
        format: pubg_map_stats

  - id: bundesliga_2
    type: football
    enabled: true
    source: openligadb
    config:
      league: bl2
      season: 2025
    schedule:
      fetchIntervalMinutes: 60
    outputs: []

  # Handball — beliebig viele Teams möglich, jedes als eigenes Modul
  # teamId aus der handball.net-URL ablesen: handball4all.{verband}.{numericId}
  - id: handball_mein_team
    type: handball
    enabled: false    # teamId + Teamnamen eintragen und auf true setzen
    source: handball_api
    config:
      teamId: "handball4all.westfalen.1309001"
    schedule:
      fetchIntervalMinutes: 60
    outputs: []

  - id: formula1_2025
    type: formula1
    enabled: true
    source: jolpica_f1
    config:
      season: "2025"
    schedule:
      fetchIntervalMinutes: 60
    outputs: []

  - id: handball_zweites_team
    type: handball
    enabled: false
    source: handball_api
    config:
      teamId: "handball4all.westfalen.9999999"  # Eigene ID eintragen
    schedule:
      fetchIntervalMinutes: 60
    outputs: []

  - id: handball_stats_nrw_300268
    type: handball_statistics
    enabled: true
    source: handball_statistics_api
    config:
      leagueId: "300268"
      season: "2526"
    schedule:
      fetchIntervalMinutes: 60
    outputs: []

  - id: wm2026
    type: worldcup2026
    enabled: true
    source: api_football
    config:
      league: "1"
      season: "2026"
    schedule:
      fetchIntervalMinutes: 720
    outputs: []

outputs:
  discord:
    channels:
      sport: ${DISCORD_SPORT_WEBHOOK}
      news: ${DISCORD_NEWS_WEBHOOK}
      gaming: ${DISCORD_CHANNEL_PUBG}
      allgemein: ${DISCORD_CHANNEL_NEWSALLGEMEIN}
