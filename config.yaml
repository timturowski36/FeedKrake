modules:
  - id: pubg_friends
    type: pubg
    enabled: true
    source: pubg_api
    config:
      platform: steam
    players:
      - "brotrustgaming"
      - "philipnc"
      - "chrissi1970"
      - "Alxndr_D"
    accountIds:
      - "account.af4b877b95df46a3804d38d8be1d3225"
    schedule:
      fetchIntervalMinutes: 30
    outputs:
      # Tagesstatistik – täglich um 09:00
      - type: discord
        channel: pubg
        schedule: DAILY_09_00
        format: pubg_daily_stats

      # Wochenstatistik – montags um 09:00
      - type: discord
        channel: pubg
        schedule: WEEKLY_MONDAY_09_00
        format: pubg_weekly_stats

      # Wochenranking – montags um 09:15
      - type: discord
        channel: pubg
        schedule: WEEKLY_MONDAY_09_15
        format: pubg_weekly_ranking

      # Wochenvergleich – sonntags um 23:45
      - type: discord
        channel: pubg
        schedule: WEEKLY_SUNDAY_23_45
        format: pubg_weekly_progress

      # Persönliche Rekorde – mittwochs um 20:00
      - type: discord
        channel: pubg
        schedule: WEEKLY_WEDNESDAY_20_00
        format: pubg_records

      # Persönliche Rekorde – samstags um 20:00
      - type: discord
        channel: pubg
        schedule: WEEKLY_SATURDAY_20_00
        format: pubg_records

      # Letzte Matches – montags um 10:15
      - type: discord
        channel: pubg
        schedule: WEEKLY_MONDAY_10_15
        format: pubg_recent_matches
        params:
          limit: "5"

      # Map-Statistiken – sonntags um 23:50
      - type: discord
        channel: pubg
        schedule: WEEKLY_SUNDAY_23_50
        format: pubg_map_stats

outputs:
  discord:
    channels:
      pubg: ${DISCORD_CHANNEL_PUBG}
