<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NooNoo Ambient</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0b0d12;
      color: #e6e8ee;
      font: 18px/1.5 system-ui, -apple-system, sans-serif;
    }
    body { display: flex; flex-direction: column; }

    h1 { font-size: clamp(1.6rem, 3vw, 2.4rem); margin-bottom: 1.2rem; color: #fff; }
    .meta { color: #606880; font-size: .85rem; margin-top: 1.2rem; }
    .empty-info { color: #9aa3b5; font-size: 1.05rem; max-width: 36rem; line-height: 1.5; }

    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { text-align: left; padding: .5rem .7rem; color: #8a93a6; font-weight: 500;
         border-bottom: 1px solid #20242d; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
    td { padding: .55rem .7rem; border-bottom: 1px solid #16191f; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #13161c; }

    .rank { color: #8a93a6; width: 2rem; }
    .pts  { font-weight: 600; color: #c8d0e0; }
    .hl   { color: #f0b429; }

    ul { list-style: none; }
    ul li { padding: .55rem 0; border-bottom: 1px solid #16191f; }
    ul li:last-child { border-bottom: none; }
    ul li::before { content: "›"; margin-right: .5rem; color: #3a7bd5; }

    .tag {
      display: inline-block; font-size: .75rem; padding: .15rem .5rem;
      border-radius: 4px; margin-bottom: .8rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase;
    }
    .tag-pubg     { background: #1a2d1a; color: #4ade80; }
    .tag-football { background: #1a1f2d; color: #60a5fa; }
    .tag-handball { background: #2d1a2a; color: #f472b6; }
    .tag-news     { background: #2d261a; color: #fbbf24; }
    .tag-f1       { background: #2d1a1a; color: #f87171; }
    .tag-wm       { background: #1a2d2d; color: #2dd4bf; }

    .wm-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; }
    .wm-group h3 { font-size: .8rem; color: #8a93a6; margin-bottom: .4rem;
                   text-transform: uppercase; letter-spacing: .05em; font-weight: 500; }
    .wm-group table { font-size: .85rem; }
    .wm-group th, .wm-group td { padding: .3rem .4rem; }

    main { flex: 1; display: grid; place-items: center; padding: 2rem; }
    #slide { width: min(1100px, 100%); transition: opacity .35s ease; }
    #slide.fade { opacity: 0; }

    #status { position: fixed; bottom: 1rem; right: 1rem; font-size: .75rem; color: #404555;
              background: #0b0d12; padding: .3rem .6rem; border-radius: 4px; }

    /* Modul-Auswahl-Leiste */
    #module-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: .8rem 1.2rem; gap: 1rem; flex-wrap: wrap;
      background: #11141b; border-bottom: 1px solid #20242d;
      position: sticky; top: 0; z-index: 10;
    }
    .modules { display: flex; gap: .5rem; flex-wrap: wrap; }
    .module-btn, #skip-btn {
      min-height: 44px; padding: .5rem 1rem;
      border: 1px solid #2a2f3a; border-radius: 8px;
      background: #1a1e27; color: #8a93a6;
      font: inherit; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .module-btn:hover, #skip-btn:hover { background: #232834; color: #e6e8ee; }
    .module-btn[aria-pressed="true"] {
      background: #2d4a7a; color: #fff; border-color: #3a5f9a;
    }
    #skip-btn { background: #2d7a4a; color: #fff; border-color: #3a9a5f; }
    #empty-hint {
      background: #7a4a2d; color: #fff; padding: 1rem 1.2rem;
      text-align: center; font-weight: 500;
    }

    /* Mobile: Buttons enger */
    @media (max-width: 600px) {
      #module-bar { padding: .5rem .6rem; }
      .module-btn, #skip-btn { padding: .4rem .7rem; font-size: .9rem; }
    }
  </style>
</head>
<body>
  <header id="module-bar">
    <div class="modules">
      <button class="module-btn" data-module="bundesliga">Bundesliga</button>
      <button class="module-btn" data-module="pubg">PUBG</button>
      <button class="module-btn" data-module="wm">WM</button>
      <button class="module-btn" data-module="f1">F1</button>
      <button class="module-btn" data-module="handball">Handball</button>
      <button class="module-btn" data-module="news">News</button>
    </div>
    <button id="skip-btn" title="Nächster Slide">▶ Weiter</button>
  </header>

  <div id="empty-hint" hidden>
    Wähle mindestens ein Modul aus. Andernfalls werden in 10 Sekunden alle Module aktiviert.
  </div>

  <main id="slide">
    <h1>NooNoo lädt…</h1>
  </main>
  <div id="status">verbinde…</div>

  <script>
    const ALL_MODULES = ["bundesliga", "pubg", "wm", "f1", "handball", "news"];
    const STORAGE_KEY = "noonoo.modules";
    const EMPTY_FALLBACK_MS = 10_000;

    const slide     = document.getElementById("slide");
    const status    = document.getElementById("status");
    const moduleBar = document.getElementById("module-bar");
    const skipBtn   = document.getElementById("skip-btn");
    const emptyHint = document.getElementById("empty-hint");

    // Stabile Session-ID für diesen Browser-Tab (verschwindet bei Reload, das ist okay)
    const sessionId = crypto.randomUUID();

    // === Modul-Auswahl: laden, parsen, persistieren ===

    function loadSelection() {
      const url = new URL(window.location.href);
      const fromUrl = url.searchParams.get("modules");
      if (fromUrl !== null) return parseModuleList(fromUrl);
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored !== null) return parseModuleList(stored);
      } catch {}
      return new Set(ALL_MODULES);
    }

    function parseModuleList(str) {
      const set = new Set(
        str.split(",")
           .map(s => s.trim().toLowerCase())
           .filter(s => ALL_MODULES.includes(s))
      );
      return set.size > 0 ? set : new Set(ALL_MODULES);
    }

    function persistSelection(sel) {
      const list = [...sel].sort().join(",");
      const url = new URL(window.location.href);
      if (sel.size === ALL_MODULES.length) {
        url.searchParams.delete("modules");
      } else {
        url.searchParams.set("modules", list);
      }
      history.replaceState(null, "", url.toString());
      try { localStorage.setItem(STORAGE_KEY, list); } catch {}
    }

    let selection = loadSelection();
    let emptyFallbackTimer = null;

    function renderModuleButtons() {
      moduleBar.querySelectorAll(".module-btn").forEach(btn => {
        const mod = btn.dataset.module;
        btn.setAttribute("aria-pressed", selection.has(mod) ? "true" : "false");
      });
      if (selection.size === 0) {
        emptyHint.hidden = false;
        clearTimeout(emptyFallbackTimer);
        emptyFallbackTimer = setTimeout(() => {
          selection = new Set(ALL_MODULES);
          applySelectionChange();
        }, EMPTY_FALLBACK_MS);
      } else {
        emptyHint.hidden = true;
        clearTimeout(emptyFallbackTimer);
      }
    }

    function applySelectionChange() {
      persistSelection(selection);
      renderModuleButtons();
      reconnectStream();
    }

    moduleBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".module-btn");
      if (!btn) return;
      const mod = btn.dataset.module;
      if (selection.has(mod)) selection.delete(mod);
      else selection.add(mod);
      applySelectionChange();
    });

    // === Weiter-Button ===

    skipBtn.addEventListener("click", () => {
      fetch(`/skip?sid=${sessionId}`, { method: "POST" })
        .catch(err => console.warn("Skip fehlgeschlagen", err));
      skipBtn.disabled = true;
      setTimeout(() => { skipBtn.disabled = false; }, 1500);
    });

    // === SSE-Verbindung ===

    let es = null;

    function connectStream() {
      const modules = [...selection].sort().join(",");
      es = new EventSource(`/ambient?sid=${sessionId}&modules=${encodeURIComponent(modules)}`);

      es.addEventListener("slide", e => {
        const data = JSON.parse(e.data);
        transition(() => { slide.innerHTML = renderSlide(data); });
        status.textContent = "verbunden · " + new Date().toLocaleTimeString('de-DE');
      });

      es.onerror = () => { status.textContent = "getrennt – reconnect…"; };
      es.onopen  = () => { status.textContent = "verbunden"; };
    }

    function reconnectStream() {
      if (es) { es.close(); es = null; }
      if (selection.size === 0) {
        slide.innerHTML = "<h1>Keine Module aktiv</h1>";
        status.textContent = "pausiert";
        return;
      }
      connectStream();
    }

    function transition(fn) {
      if (document.startViewTransition) {
        document.startViewTransition(fn);
      } else {
        slide.classList.add("fade");
        setTimeout(() => { fn(); slide.classList.remove("fade"); }, 350);
      }
    }

    function renderSlide(s) {
      const p = s.payload;
      const ts = new Date(s.generatedAt).toLocaleString('de-DE');
      const meta = `<div class="meta">Stand: ${ts}</div>`;

      if (s.type === "pubg.daily" || s.type === "pubg.weekly") {
        const label = s.type === "pubg.daily" ? "PUBG · Heute" : "PUBG · 7 Tage";
        return tag(label, "pubg") + `<h1>${esc(s.title)}</h1>` + renderPubgTable(p.players) + meta;
      }
      if (s.type === "football.bl1" || s.type === "football.bl2") {
        const label = s.type === "football.bl1" ? "Fußball · BL1" : "Fußball · BL2";
        return tag(label, "football") + `<h1>${esc(s.title)}</h1>` + renderFootballTable(p.rows) + meta;
      }
      if (s.type === "handball.scorers") {
        return tag("Handball · Torschützen", "handball") + `<h1>${esc(s.title)}</h1>` + renderHandballTable(p.rows) + meta;
      }
      if (s.type.startsWith("news.")) {
        const label = s.type === "news.tagesschau" ? "Nachrichten · Tagesschau" : "Tech-News · Heise";
        return tag(label, "news") + `<h1>${esc(s.title)}</h1>` + renderNews(p.items) + meta;
      }
      if (s.type === "f1.drivers") {
        return tag("Formel 1 · Fahrerwertung", "f1") + `<h1>${esc(s.title)}</h1>` + renderF1Table(p.rows) + meta;
      }
      if (s.type === "wm.fixtures") {
        return tag("WM 2026 · Spiele", "wm") + `<h1>${esc(s.title)}</h1>` + renderWmFixtures(p.fixtures) + meta;
      }
      if (s.type === "wm.standings") {
        return tag("WM 2026 · Gruppen", "wm") + `<h1>${esc(s.title)}</h1>` + renderWmGroups(p.groups) + meta;
      }
      if (s.type === "wm.topscorers") {
        return tag("WM 2026 · Torschützen", "wm") + `<h1>${esc(s.title)}</h1>` + renderWmScorers(p.rows) + meta;
      }
      if (s.type === "system.empty") {
        return `<h1>${esc(s.title)}</h1><p class="empty-info">${esc(p.message)}</p>`;
      }
      return `<h1>${esc(s.title)}</h1><pre>${esc(JSON.stringify(p, null, 2))}</pre>` + meta;
    }

    function tag(label, cls) {
      return `<span class="tag tag-${cls}">${esc(label)}</span><br>`;
    }

    function renderPubgTable(players) {
      const rows = players.map((p, i) =>
        `<tr>
          <td class="rank">${i + 1}</td>
          <td><strong>${esc(p.name)}</strong></td>
          <td>${p.matches} Spiele</td>
          <td class="hl">${p.kills} Kills</td>
          <td>${p.wins} Siege</td>
          <td>${p.avgDamage} Ø-Damage</td>
          <td>${p.headshotKills} HS</td>
          <td>${p.longestKill ? p.longestKill.toFixed(0) + "m" : "–"}</td>
        </tr>`
      ).join("");
      return `<table><thead><tr>
        <th>#</th><th>Spieler</th><th>Matches</th><th>Kills</th><th>Siege</th>
        <th>Ø Damage</th><th>HS-Kills</th><th>Longest</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderFootballTable(rows) {
      const trs = rows.map(r =>
        `<tr>
          <td class="rank">${r.position}</td>
          <td><strong>${esc(r.team)}</strong></td>
          <td>${r.played}</td>
          <td>${r.won}</td>
          <td>${r.draw}</td>
          <td>${r.lost}</td>
          <td>${esc(r.goals)}</td>
          <td class="pts">${r.points}</td>
        </tr>`
      ).join("");
      return `<table><thead><tr>
        <th>#</th><th>Verein</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th>Pkt</th>
      </tr></thead><tbody>${trs}</tbody></table>`;
    }

    function renderHandballTable(rows) {
      const trs = rows.map(r =>
        `<tr>
          <td class="rank">${r.position}</td>
          <td><strong>${esc(r.player)}</strong></td>
          <td>${esc(r.team)}</td>
          <td>${r.games}</td>
          <td class="hl">${r.goals}</td>
          <td>${r.goalsPerGame.toFixed(2)}</td>
        </tr>`
      ).join("");
      return `<table><thead><tr>
        <th>#</th><th>Spieler</th><th>Verein</th><th>Spiele</th><th>Tore</th><th>Ø/Spiel</th>
      </tr></thead><tbody>${trs}</tbody></table>`;
    }

    function renderNews(items) {
      return "<ul>" + items.map(i => `<li>${esc(i.title)}</li>`).join("") + "</ul>";
    }

    function renderF1Table(rows) {
      const trs = rows.map(r =>
        `<tr>
          <td class="rank">${r.position}</td>
          <td><strong>${esc(r.driver)}</strong></td>
          <td>${esc(r.constructor)}</td>
          <td class="pts">${r.points}</td>
          <td>${r.wins}</td>
        </tr>`
      ).join("");
      return `<table><thead><tr>
        <th>#</th><th>Fahrer</th><th>Team</th><th>Punkte</th><th>Siege</th>
      </tr></thead><tbody>${trs}</tbody></table>`;
    }

    const WM_STATUS_LABELS = {
      NS: "Bevorstehend", FIRST_HALF: "1. Halbzeit", HT: "Halbzeit", SECOND_HALF: "2. Halbzeit",
      ET: "Verlängerung", BT: "Pause", PEN: "Elfmeterschießen", FT: "Beendet", AET: "n. V.",
      PST: "Verschoben", CANC: "Abgesagt"
    };

    function renderWmFixtures(fixtures) {
      const trs = fixtures.map(f => {
        const dt = new Date(f.kickoff).toLocaleString('de-DE', { timeZone: 'Europe/Berlin', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const score = (f.homeScore !== null && f.awayScore !== null) ? `${f.homeScore}:${f.awayScore}` : "–";
        return `<tr>
          <td>${esc(dt)}</td>
          <td><strong>${esc(f.home)}</strong> – <strong>${esc(f.away)}</strong></td>
          <td>${esc(f.group || f.round)}</td>
          <td class="hl">${esc(score)}</td>
          <td>${esc(WM_STATUS_LABELS[f.status] || f.status)}</td>
        </tr>`;
      }).join("");
      return `<table><thead><tr>
        <th>Anstoß</th><th>Spiel</th><th>Gruppe</th><th>Ergebnis</th><th>Status</th>
      </tr></thead><tbody>${trs}</tbody></table>`;
    }

    function renderWmGroups(groups) {
      const cards = groups.map(g => `
        <div class="wm-group">
          <h3>${esc(g.name)}</h3>
          <table><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>Pkt</th><th>Tordiff</th></tr></thead>
          <tbody>${g.rows.map(r => `<tr>
            <td class="rank">${r.rank}</td>
            <td>${esc(r.team)}</td>
            <td>${r.played}</td>
            <td class="pts">${r.points}</td>
            <td>${r.goalDiff > 0 ? "+" + r.goalDiff : r.goalDiff}</td>
          </tr>`).join("")}</tbody></table>
        </div>`
      ).join("");
      return `<div class="wm-groups">${cards}</div>`;
    }

    function renderWmScorers(rows) {
      const trs = rows.map(r =>
        `<tr>
          <td class="rank">${r.rank}</td>
          <td><strong>${esc(r.player)}</strong></td>
          <td>${esc(r.team)}</td>
          <td class="hl">${r.goals}</td>
          <td>${r.assists}</td>
        </tr>`
      ).join("");
      return `<table><thead><tr>
        <th>#</th><th>Spieler</th><th>Team</th><th>Tore</th><th>Assists</th>
      </tr></thead><tbody>${trs}</tbody></table>`;
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, c =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    }

    renderModuleButtons();
    reconnectStream();
  </script>
</body>
</html>
