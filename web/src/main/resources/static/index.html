<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NooNoo Ambient</title>
  <style>
    :root { color-scheme: dark; --accent: #4f9cf9; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #e6e8ee;
                 font: 17px/1.5 system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    main { width: min(1100px, 94vw); padding: 3vh 0 4vh; }

    h1   { font-size: clamp(1.6rem, 3vw, 2.4rem); margin: 0 0 .6rem; }
    .meta { color: #687080; font-size: .85rem; margin-bottom: 1.4rem; }
    .badge { display: inline-block; background: #1a2030; border: 1px solid #2a3245;
             border-radius: 4px; padding: .15em .55em; font-size: .75rem;
             color: var(--accent); margin-right: .4rem; vertical-align: middle; }

    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th    { text-align: left; padding: .4rem .7rem; color: #687080;
            font-weight: 500; border-bottom: 1px solid #1e2535; font-size: .85rem; }
    td    { padding: .45rem .7rem; border-bottom: 1px solid #151b27; }
    tr:hover td { background: #12182a; }
    .num  { text-align: right; }

    /* News */
    .news-list { list-style: none; padding: 0; margin: 0; }
    .news-list li { padding: .6rem 0; border-bottom: 1px solid #151b27; }
    .news-list li:last-child { border: none; }
    .news-list a { color: #d0daf0; text-decoration: none; font-size: 1.05rem; }
    .news-list a:hover { color: var(--accent); }
    .news-ts { color: #687080; font-size: .8rem; margin-top: .15rem; }

    /* WM Gruppen */
    .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; }
    .group-card { background: #111622; border: 1px solid #1e2535; border-radius: 8px; padding: .8rem 1rem; }
    .group-label { font-size: .75rem; color: var(--accent); font-weight: 600;
                   letter-spacing: .06em; margin-bottom: .5rem; }

    /* View Transitions */
    #slide { view-transition-name: slide; }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
    @keyframes fadeOut { from { opacity:1 } to { opacity:0 } }
    ::view-transition-old(slide) { animation: fadeOut .35s ease both; }
    ::view-transition-new(slide) { animation: fadeIn  .35s ease both; }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(slide), ::view-transition-new(slide) { animation: none; }
    }
  </style>
</head>
<body>
  <main id="slide">
    <h1>NooNoo lädt…</h1>
    <p class="meta">Verbinde mit Server…</p>
  </main>

  <script>
    const el = document.getElementById("slide");
    const es = new EventSource("/ambient");

    es.addEventListener("slide", e => {
      const s = JSON.parse(e.data);
      const html = render(s);
      if (document.startViewTransition) {
        document.startViewTransition(() => { el.innerHTML = html; });
      } else {
        el.innerHTML = html;
      }
    });
    es.onerror = () => {};  // EventSource reconnectet automatisch

    // ── Render-Dispatcher ────────────────────────────────────────────────────

    function render(s) {
      const header = `<h1><span class="badge">${esc(s.type)}</span> ${esc(s.title)}</h1>
        <div class="meta">Stand: ${fmtTs(s.generatedAt)}</div>`;
      const body = renderData(s.type, s.data);
      return header + body;
    }

    function renderData(type, data) {
      if (!data || data.length === 0) return "<p>Keine Daten verfügbar.</p>";
      if (type === "bundesliga.t1" || type === "bundesliga.t2") return renderBundesliga(data);
      if (type === "news.tagesschau" || type === "news.heise")  return renderNews(data);
      if (type === "f1.standings")   return renderF1(data);
      if (type === "handball.table") return renderHandball(data);
      if (type === "wm.standings")   return renderWmStandings(data);
      if (type === "wm.fixtures")    return renderWmFixtures(data);
      if (type === "pubg.ranking")   return renderPubg(data);
      return `<pre>${esc(JSON.stringify(data, null, 2))}</pre>`;
    }

    // ── Bundesliga ────────────────────────────────────────────────────────────

    function renderBundesliga(rows) {
      const body = rows.map(r => `
        <tr>
          <td class="num">${r.pos}</td>
          <td>${esc(r.team)}</td>
          <td class="num">${r.sp}</td>
          <td class="num">${r.w}</td>
          <td class="num">${r.d}</td>
          <td class="num">${r.l}</td>
          <td class="num">${r.gf}:${r.ga}</td>
          <td class="num"><strong>${r.pts}</strong></td>
        </tr>`).join("");
      return `<table><thead><tr>
        <th class="num">#</th><th>Verein</th><th class="num">Sp</th>
        <th class="num">S</th><th class="num">U</th><th class="num">N</th>
        <th class="num">Tore</th><th class="num">Pkt</th>
      </tr></thead><tbody>${body}</tbody></table>`;
    }

    // ── News ──────────────────────────────────────────────────────────────────

    function renderNews(items) {
      return "<ul class='news-list'>" + items.map(i => `
        <li>
          <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
          <div class="news-ts">${fmtTs(i.ts)}</div>
        </li>`).join("") + "</ul>";
    }

    // ── F1 ────────────────────────────────────────────────────────────────────

    function renderF1(rows) {
      const body = rows.map(r => `
        <tr>
          <td class="num">${r.pos}.</td>
          <td>${esc(r.driver)}</td>
          <td style="color:#687080">${esc(r.team)}</td>
          <td class="num"><strong>${r.pts}</strong></td>
          <td class="num">${r.wins} Siege</td>
        </tr>`).join("");
      return `<table><thead><tr>
        <th class="num">#</th><th>Fahrer</th><th>Team</th>
        <th class="num">Punkte</th><th class="num">Siege</th>
      </tr></thead><tbody>${body}</tbody></table>`;
    }

    // ── Handball ─────────────────────────────────────────────────────────────

    function renderHandball(rows) {
      const body = rows.map(r => `
        <tr>
          <td class="num">${r.pos}</td>
          <td>${esc(r.team)}</td>
          <td class="num">${r.sp}</td>
          <td class="num">${r.gf}:${r.ga}</td>
          <td class="num"><strong>${r.pts}</strong></td>
        </tr>`).join("");
      return `<table><thead><tr>
        <th class="num">#</th><th>Team</th>
        <th class="num">Sp</th><th class="num">Tore</th><th class="num">Pkt</th>
      </tr></thead><tbody>${body}</tbody></table>`;
    }

    // ── WM 2026 Gruppen ───────────────────────────────────────────────────────

    function renderWmStandings(rows) {
      const groups = {};
      rows.forEach(r => { (groups[r.group] = groups[r.group] || []).push(r); });
      const cards = Object.entries(groups).map(([g, teams]) => {
        const rows = teams.map(t => `
          <tr>
            <td class="num">${t.rank}</td>
            <td>${esc(t.team)}</td>
            <td class="num">${t.sp}</td>
            <td class="num">${t.gf}:${t.ga}</td>
            <td class="num"><strong>${t.pts}</strong></td>
          </tr>`).join("");
        return `<div class="group-card">
          <div class="group-label">Gruppe ${esc(g)}</div>
          <table><thead><tr>
            <th class="num">#</th><th>Team</th>
            <th class="num">Sp</th><th class="num">Tore</th><th class="num">Pkt</th>
          </tr></thead><tbody>${rows}</tbody></table>
        </div>`;
      }).join("");
      return `<div class="group-grid">${cards}</div>`;
    }

    // ── WM 2026 Fixtures ──────────────────────────────────────────────────────

    function renderWmFixtures(fixtures) {
      if (!fixtures.length) return "<p>Keine anstehenden Spiele.</p>";
      const body = fixtures.map(f => {
        const score = (f.homeScore != null)
          ? `<strong>${f.homeScore} : ${f.awayScore}</strong>`
          : fmtKickoff(f.kickoff);
        return `<tr>
          <td>${esc(f.round)}${f.group ? " / Gr. " + esc(f.group) : ""}</td>
          <td style="text-align:right">${esc(f.home)}</td>
          <td style="text-align:center;padding:0 .8rem">${score}</td>
          <td>${esc(f.away)}</td>
          <td style="color:#687080;font-size:.85rem">${esc(f.status)}</td>
        </tr>`;
      }).join("");
      return `<table><thead><tr>
        <th>Runde</th><th style="text-align:right">Heim</th>
        <th style="text-align:center">Ergebnis / Anpfiff</th>
        <th>Gast</th><th>Status</th>
      </tr></thead><tbody>${body}</tbody></table>`;
    }

    // ── PUBG ─────────────────────────────────────────────────────────────────

    function renderPubg(rows) {
      const body = rows.map(r => `
        <tr>
          <td class="num">${r.rank}.</td>
          <td>${esc(r.player)}</td>
          <td class="num">${r.matches}</td>
          <td class="num">${r.wins}</td>
          <td class="num">${r.avgKills}</td>
          <td class="num">${r.avgDamage}</td>
        </tr>`).join("");
      return `<table><thead><tr>
        <th class="num">#</th><th>Spieler</th>
        <th class="num">Matches</th><th class="num">Siege</th>
        <th class="num">Ø Kills</th><th class="num">Ø Damage</th>
      </tr></thead><tbody>${body}</tbody></table>`;
    }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, c =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    }

    function fmtTs(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleString("de-DE",
        { day:"2-digit", month:"2-digit", year:"numeric",
          hour:"2-digit", minute:"2-digit" });
    }

    function fmtKickoff(iso) {
      if (!iso) return "?";
      const d = new Date(iso);
      return d.toLocaleString("de-DE",
        { weekday:"short", day:"2-digit", month:"2-digit",
          hour:"2-digit", minute:"2-digit" }) + " Uhr";
    }
  </script>
</body>
</html>
