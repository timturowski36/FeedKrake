<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2f7">
  <title>NooNoo Kalender</title>
  <!-- Theme VOR dem ersten Paint setzen (kein Hell-Aufblitz für Dark-Nutzer); Default folgt dem OS. -->
  <script>try{var t=localStorage.getItem('kal.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dunkel':'hell');document.documentElement.setAttribute('data-theme',t);document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='dunkel'?'#000000':'#f2f2f7')}catch(e){}</script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sheet.css">
  <link rel="stylesheet" href="css/config.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="hdr-left">
        <div class="kw-label" id="kw-label"></div>
        <h1 id="month-label"></h1>
      </div>
      <div class="hdr-actions">
        <button class="icon-btn" id="btn-search" aria-label="Suche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <span class="hdr-spacer"></span>
        <button class="icon-btn" id="btn-prev" aria-label="Vorige Woche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="pill-btn" id="btn-today">Heute</button>
        <button class="icon-btn" id="btn-next" aria-label="Nächste Woche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <span class="hdr-spacer"></span>
        <button class="icon-btn" id="btn-config" aria-label="Konfiguration">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 003.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H8a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V8a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
        <button class="icon-btn" id="btn-account" aria-label="Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>
        </button>
      </div>
    </header>

    <div class="pill-bar" id="pill-bar"></div>
    <div class="mobile-day-title" id="mobile-day-title"></div>

    <main id="week-grid"></main>
    <div class="empty-week" id="empty-week" hidden>
      <div class="empty-week-title">Keine Einträge</div>
      <div class="empty-week-sub">Füge Module in der <a href="#" id="empty-week-config-link">Konfiguration</a> hinzu.</div>
    </div>
    <div class="swipe-hint">← Wischen zum Tageswechsel →</div>
  </div>

  <div id="screen-config" hidden></div>
  <div id="screen-account" hidden></div>

  <div id="search-overlay" hidden>
    <div class="search-panel">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search-input" placeholder="Suchen: Termine, Läufe, Spiele, Urlaub …">
        <button class="search-close" id="search-close" aria-label="Schließen">✕</button>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <div id="sheet-backdrop" hidden>
    <div class="sheet-panel">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <div class="sheet-header-text">
          <span class="sheet-badge" id="sheet-badge"></span>
          <h2 id="sheet-title"></h2>
          <span class="sheet-date" id="sheet-date"></span>
        </div>
        <button class="sheet-close" id="sheet-close" aria-label="Schließen">✕</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
