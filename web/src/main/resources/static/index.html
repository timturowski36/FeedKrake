<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NooNoo Kalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
  <style>
    /* ── CSS-Variablen (identisch zur Ambient-Seite) ───────────────────────── */
    :root {
      --color-bg:             #0d0d0d;
      --color-bg-elevated:    #141414;
      --color-bg-subtle:      #1a1a1a;
      --color-text-primary:   #f0ede8;
      --color-text-secondary: #8a8580;
      --color-text-muted:     #4a4845;
      --color-accent:         #e8472a;
      --color-accent-dim:     rgba(232, 71, 42, 0.15);
      --color-live:           #e8472a;
      --color-win:            #4a8a5a;
      --color-border:         #222220;
      --color-border-strong:  #333330;

      --font-serif: "Source Serif 4", "Times New Roman", serif;
      --font-mono:  "JetBrains Mono", "Courier New", monospace;

      --mod-bl1:  #e8472a;
      --mod-bl2:  #e8b42a;
      --mod-hb:   #4a8a5a;
      --mod-wm:   #4a7fd4;
      --mod-f1:   #c0392b;
      --mod-pubg: #b07a3a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    button { font-family: var(--font-mono); cursor: pointer; }
    a { color: inherit; }

    /* ── Header ────────────────────────────────────────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 0.75rem;
      padding: 0.75rem clamp(0.75rem, 3vw, 2.5rem);
      background: var(--color-bg-elevated);
      border-bottom: 1px solid var(--color-border);
      position: sticky; top: 0; z-index: 50;
    }
    .brand { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 700; letter-spacing: 0.02em; }
    .brand span { color: var(--color-accent); }
    .week-nav { display: flex; align-items: center; gap: 0.5rem; }
    .week-nav button, .hdr-btn {
      background: transparent; color: var(--color-text-secondary);
      border: 1px solid var(--color-border-strong); border-radius: 2px;
      padding: 0.4rem 0.7rem; font-size: 0.75rem; letter-spacing: 0.06em;
      text-transform: uppercase; transition: color .15s, border-color .15s;
      text-decoration: none; display: inline-block;
    }
    .week-nav button:hover, .hdr-btn:hover { color: var(--color-text-primary); border-color: var(--color-text-muted); }
    #week-label { font-size: 0.85rem; min-width: 15ch; text-align: center; }
    #week-label small { display: block; color: var(--color-text-secondary); font-size: 0.65rem; }
    .hdr-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .code-chip {
      font-size: 0.75rem; padding: 0.4rem 0.7rem;
      border: 1px solid var(--color-accent); color: var(--color-accent);
      background: var(--color-accent-dim); border-radius: 2px; letter-spacing: 0.15em;
    }
    .code-chip button { background: none; border: none; color: inherit; margin-left: 0.4rem; font-size: 0.7rem; }

    /* ── Saison-Leiste ─────────────────────────────────────────────────────── */
    #season-bar {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      padding: 0.5rem clamp(0.75rem, 3vw, 2.5rem);
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
    }
    .season-chip {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border); border-radius: 2px;
      padding: 0.25rem 0.55rem;
    }
    .season-chip .dot { width: 8px; height: 8px; border-radius: 50%; }
    .season-chip.inactive { opacity: 0.45; }
    .season-chip .badge { color: var(--color-text-muted); text-transform: none; }

    /* ── Kalender-Grid ─────────────────────────────────────────────────────── */
    main { flex: 1; padding: 1rem clamp(0.75rem, 3vw, 2.5rem) 4.5rem; }
    #grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.5rem; }
    .day { background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: 3px; min-height: 40vh; display: flex; flex-direction: column; }
    .day-head {
      padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--color-border);
      font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--color-text-secondary); display: flex; justify-content: space-between;
    }
    .day.today { border-color: var(--color-accent); }
    .day.today .day-head { color: var(--color-accent); }
    .day-events { padding: 0.4rem; display: flex; flex-direction: column; gap: 0.4rem; }

    .event-card {
      border: 1px solid var(--color-border-strong); border-left: 3px solid var(--mod, var(--color-border-strong));
      border-radius: 2px; padding: 0.45rem 0.55rem; background: var(--color-bg-subtle);
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .event-card:hover { border-color: var(--color-text-muted); }
    .event-card .meta { display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--color-text-secondary); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.25rem; gap: 0.3rem; }
    .event-card .title { font-family: var(--font-serif); font-size: 0.88rem; line-height: 1.25; }
    .event-card .score { font-weight: 700; margin-top: 0.2rem; font-size: 0.8rem; }
    .event-card .sub { font-size: 0.62rem; color: var(--color-text-muted); margin-top: 0.2rem; }
    .event-card.placeholder .title { color: var(--color-text-secondary); font-style: italic; }
    .status-live { color: var(--color-live); animation: pulse 1.4s infinite; }
    .status-cancelled { text-decoration: line-through; color: var(--color-text-muted); }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .empty-week {
      grid-column: 1 / -1; text-align: center; color: var(--color-text-muted);
      padding: 3rem 1rem; font-size: 0.85rem;
    }

    /* ── Drawer (Event-Details) ────────────────────────────────────────────── */
    #drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; z-index: 90;
    }
    #drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw);
      background: var(--color-bg-elevated); border-left: 1px solid var(--color-border-strong);
      z-index: 95; transform: translateX(100%); transition: transform .25s ease;
      display: flex; flex-direction: column;
    }
    #drawer.open { transform: translateX(0); }
    #drawer-backdrop.open { display: block; }
    .drawer-head { padding: 1rem; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: start; gap: 0.5rem; }
    .drawer-head h2 { font-family: var(--font-serif); font-size: 1.15rem; line-height: 1.3; }
    .drawer-head .mod-tag { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-secondary); display: block; margin-bottom: 0.3rem; }
    .drawer-body { overflow-y: auto; padding: 1rem; flex: 1; }
    .drawer-body h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-secondary); margin: 1.1rem 0 0.5rem; }
    .drawer-body h3:first-child { margin-top: 0; }
    .close-btn { background: none; border: 1px solid var(--color-border-strong); color: var(--color-text-secondary); border-radius: 2px; padding: 0.25rem 0.55rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
    th, td { text-align: left; padding: 0.28rem 0.35rem; border-bottom: 1px solid var(--color-border); }
    th { color: var(--color-text-muted); font-weight: 500; text-transform: uppercase; font-size: 0.6rem; letter-spacing: 0.06em; }
    td.num, th.num { text-align: right; }
    tr.hl td { color: var(--color-accent); }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { color: var(--color-accent); }
    .back-link { display: inline-block; font-size: 0.72rem; color: var(--color-text-secondary); margin-bottom: 0.5rem; text-decoration: none; }
    .back-link:hover { color: var(--color-accent); }
    .evt-line { display: flex; gap: 0.6rem; font-size: 0.75rem; padding: 0.25rem 0; border-bottom: 1px solid var(--color-border); }
    .evt-line .min { color: var(--color-text-muted); min-width: 3ch; }
    .ics-link { display: inline-block; margin-top: 1rem; }

    /* ── Modal (Konfigurator) ──────────────────────────────────────────────── */
    #modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
    #modal-backdrop.open { display: flex; }
    #modal {
      background: var(--color-bg-elevated); border: 1px solid var(--color-border-strong); border-radius: 4px;
      width: min(680px, 100%); max-height: 88vh; display: flex; flex-direction: column;
    }
    .modal-head { padding: 1rem; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
    .modal-head h2 { font-family: var(--font-serif); font-size: 1.15rem; }
    .modal-body { padding: 1rem; overflow-y: auto; }
    .modal-foot { padding: 1rem; border-top: 1px solid var(--color-border); display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .cfg-module { border: 1px solid var(--color-border); border-radius: 3px; margin-bottom: 0.6rem; }
    .cfg-module > label { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.75rem; font-size: 0.8rem; cursor: pointer; }
    .cfg-options { display: none; padding: 0 0.75rem 0.6rem; max-height: 180px; overflow-y: auto; }
    .cfg-module.on .cfg-options { display: block; }
    .cfg-options label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; color: var(--color-text-secondary); padding: 0.15rem 0; cursor: pointer; }
    .cfg-hint { font-size: 0.62rem; color: var(--color-text-muted); padding: 0 0.75rem 0.5rem; }
    .primary-btn {
      background: var(--color-accent); color: #fff; border: none; border-radius: 2px;
      padding: 0.5rem 1rem; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .code-input {
      background: var(--color-bg); border: 1px solid var(--color-border-strong); color: var(--color-text-primary);
      font-family: var(--font-mono); padding: 0.45rem 0.6rem; border-radius: 2px; width: 8ch;
      text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.85rem;
    }
    #cfg-result { font-size: 0.8rem; }
    #cfg-result b { color: var(--color-accent); letter-spacing: 0.2em; }

    /* ── Wetter ────────────────────────────────────────────────────────────── */
    .weather-line {
      font-size: 0.62rem; font-family: var(--font-mono);
      color: var(--color-text-secondary); padding: 0.2rem 0.6rem 0.35rem;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: 0.02em;
    }
    .weather-line:hover { color: var(--color-text-primary); }
    .weather-bar {
      display: flex; gap: 0.35rem; align-items: flex-end; padding: 0.5rem 0;
    }
    .weather-bar-col { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; font-size: 0.62rem; color: var(--color-text-muted); }
    .weather-bar-col .wh-bar { width: 18px; background: var(--color-border-strong); border-radius: 2px 2px 0 0; min-height: 2px; }
    .weather-bar-col .wh-rain { font-size: 0.55rem; color: var(--color-text-muted); }
    .weather-kpi { display: flex; gap: 1rem; margin-top: 0.75rem; font-size: 0.72rem; }
    .weather-kpi dt { color: var(--color-text-muted); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .weather-kpi dd { color: var(--color-text-primary); }

    /* ── News-Ticker ───────────────────────────────────────────────────────── */
    #ticker {
      position: fixed; left: 0; right: 0; bottom: 0; height: 2.4rem;
      background: var(--color-bg-elevated); border-top: 1px solid var(--color-border);
      display: flex; align-items: center; gap: 0.75rem; padding: 0 1rem;
      font-size: 0.72rem; z-index: 40; overflow: hidden;
    }
    #ticker .tag { color: var(--color-accent); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.6rem; flex-shrink: 0; }
    #ticker a { color: var(--color-text-secondary); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #ticker a:hover { color: var(--color-text-primary); }
    #ticker .src { color: var(--color-text-muted); flex-shrink: 0; }

    /* ── Mobile ────────────────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      #grid { grid-template-columns: 1fr; }
      .day { min-height: unset; }
      .day-events:empty::after { content: "—"; color: var(--color-text-muted); font-size: 0.7rem; padding: 0.2rem 0.3rem; }
      #drawer { width: 100vw; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">NooNoo <span>Kalender</span></div>
    <div class="week-nav">
      <button id="prev-week" aria-label="Vorige Woche">‹</button>
      <div id="week-label">…</div>
      <button id="next-week" aria-label="Nächste Woche">›</button>
      <button id="today-btn">Heute</button>
    </div>
    <div class="hdr-actions">
      <span id="code-chip"></span>
      <button class="hdr-btn" id="open-config">Konfigurieren</button>
      <a class="hdr-btn" id="ics-link" href="/calendar.ics">📅 Abonnieren</a>
    </div>
  </header>

  <div id="season-bar"></div>

  <main><div id="grid"></div></main>

  <div id="ticker"><span class="tag">News</span><span class="src" id="ticker-src"></span><a id="ticker-item" href="#" target="_blank" rel="noopener"></a></div>

  <div id="drawer-backdrop"></div>
  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div><span class="mod-tag" id="drawer-mod"></span><h2 id="drawer-title"></h2></div>
      <button class="close-btn" id="drawer-close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div id="modal-backdrop">
    <div id="modal">
      <div class="modal-head">
        <h2>Kalender konfigurieren</h2>
        <button class="close-btn" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body">Lade Katalog…</div>
      <div class="modal-foot">
        <button class="primary-btn" id="create-code">Code erzeugen</button>
        <span id="cfg-result"></span>
        <span style="flex:1"></span>
        <input class="code-input" id="code-input" maxlength="6" placeholder="CODE">
        <button class="hdr-btn" id="apply-code">Laden</button>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const MOD_COLORS = { bl1: "var(--mod-bl1)", bl2: "var(--mod-bl2)", handball: "var(--mod-hb)", wm: "var(--mod-wm)", f1: "var(--mod-f1)", pubg: "var(--mod-pubg)" };
    const MOD_LABELS = { bl1: "1. Bundesliga", bl2: "2. Bundesliga", handball: "Handball", wm: "WM 2026", f1: "Formel 1", pubg: "PUBG" };
    const DAY_NAMES = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
    const timeFmt = new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
    const dateFmt = new Intl.DateTimeFormat("de-DE", { day: "numeric", month: "short", timeZone: "Europe/Berlin" });
    const longDateFmt = new Intl.DateTimeFormat("de-DE", { day: "numeric", month: "long", timeZone: "Europe/Berlin" });

    const state = {
      week: new URLSearchParams(location.search).get("week"),
      code: new URLSearchParams(location.search).get("code") || localStorage.getItem("noonoo-code") || null,
      data: null,
      sse: null,
      catalog: null,
    };

    function esc(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    // ── Woche laden & rendern ───────────────────────────────────────────────
    async function loadWeek(push = true) {
      const params = new URLSearchParams();
      if (state.week) params.set("week", state.week);
      if (state.code) params.set("code", state.code);
      let res = await fetch("/api/calendar/week?" + params);
      if (res.status === 404 && state.code) {  // Code existiert nicht mehr
        clearCode(false);
        params.delete("code");
        res = await fetch("/api/calendar/week?" + params);
      }
      if (!res.ok) return;
      state.data = await res.json();
      state.week = state.data.week;
      if (push) {
        const url = new URL(location.href);
        url.searchParams.set("week", state.week);
        if (state.code) url.searchParams.set("code", state.code); else url.searchParams.delete("code");
        history.pushState({}, "", url);
      }
      render();
      connectSse();
    }

    function render() {
      const d = state.data;
      const monday = new Date(d.days[0] + "T12:00:00");
      const sunday = new Date(d.days[6] + "T12:00:00");
      document.getElementById("week-label").innerHTML =
        `KW ${parseInt(d.week.split("-W")[1], 10)}<small>${dateFmt.format(monday)} – ${longDateFmt.format(sunday)}</small>`;
      renderCodeChip();
      renderSeasons(d.seasons);
      renderGrid(d);
      document.getElementById("ics-link").href = state.code ? `/calendar/${state.code}.ics` : "/calendar.ics";
    }

    function renderCodeChip() {
      const el = document.getElementById("code-chip");
      el.innerHTML = state.code
        ? `<span class="code-chip">${esc(state.code)}<button title="Filter entfernen" id="clear-code">✕</button></span>`
        : "";
      const btn = document.getElementById("clear-code");
      if (btn) btn.onclick = () => clearCode(true);
    }

    function clearCode(reload) {
      state.code = null;
      localStorage.removeItem("noonoo-code");
      if (reload) loadWeek();
    }

    function renderSeasons(seasons) {
      const bar = document.getElementById("season-bar");
      bar.innerHTML = seasons.map(s => {
        const color = MOD_COLORS[s.module] || "var(--color-text-muted)";
        let badge = "";
        if (s.status === "NOT_STARTED" && s.nextEventAt)
          badge = `<span class="badge">startet ${dateFmt.format(new Date(s.nextEventAt))}</span>`;
        else if (s.status === "NOT_STARTED") badge = `<span class="badge">noch kein Termin</span>`;
        else if (s.status === "FINISHED") badge = `<span class="badge">Saison beendet</span>`;
        const inactive = s.status !== "ACTIVE" ? "inactive" : "";
        return `<span class="season-chip ${inactive}"><span class="dot" style="background:${color}"></span>${esc(s.label)} ${badge}</span>`;
      }).join("");
    }

    function renderGrid(d) {
      const grid = document.getElementById("grid");
      const today = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Berlin" }).format(new Date());
      const byDay = {};
      d.days.forEach(day => byDay[day] = []);
      for (const e of d.events) {
        if (!e.startTime) continue;
        const day = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Berlin" }).format(new Date(e.startTime));
        (byDay[day] = byDay[day] || []).push(e);
      }
      grid.innerHTML = d.days.map((day, i) => {
        const events = (byDay[day] || []);
        const cards = events.map(cardHtml).join("");
        const isToday = day === today ? "today" : "";
        const wd = d.weather?.[day];
        let weatherHtml = "";
        if (wd) {
          let text = `${esc(wd.symbol)} ${wd.tempMax}°/${wd.tempMin}°`;
          if (wd.precipProbMax >= 40) text += ` ☂ ${wd.precipProbMax}%`;
          weatherHtml = `<div class="weather-line" data-location="${esc(d.weatherLocation)}" data-day="${esc(day)}" role="button" tabindex="0" aria-label="Wetter ${DAY_NAMES[i]}">${text}</div>`;
        }
        return `<section class="day ${isToday}">
          <div class="day-head"><span>${DAY_NAMES[i]}</span><span>${dateFmt.format(new Date(day + "T12:00:00"))}</span></div>
          ${weatherHtml}
          <div class="day-events">${cards}</div>
        </section>`;
      }).join("");
      if (d.events.length === 0) {
        grid.insertAdjacentHTML("beforeend",
          `<div class="empty-week">Keine Termine in dieser Woche${state.code ? " (Filter aktiv)" : ""}.</div>`);
      }
      grid.querySelectorAll(".event-card").forEach(el =>
        el.addEventListener("click", () => openDrawer(el.dataset.id)));
      grid.querySelectorAll(".weather-line").forEach(el => {
        el.addEventListener("click", () => openWeatherDrawer(el.dataset.location, el.dataset.day));
        el.addEventListener("keydown", e => { if (e.key === "Enter") openWeatherDrawer(el.dataset.location, el.dataset.day); });
      });
    }

    function cardHtml(e) {
      const color = MOD_COLORS[e.moduleType === "WORLD_CUP" ? "wm" : slugOf(e)] || "var(--color-border-strong)";
      const time = e.startTime ? timeFmt.format(new Date(e.startTime)) : "–";
      const scores = (e.participants || []).map(p => p.score).filter(s => s != null);
      const hasPlaceholder = (e.participants || []).some(p => p.isPlaceholder);
      let statusHtml = "";
      if (e.status === "LIVE") statusHtml = `<span class="status-live">● LIVE</span>`;
      else if (e.status === "POSTPONED") statusHtml = `<span>verlegt</span>`;
      else if (e.status === "CANCELLED") statusHtml = `<span>abgesagt</span>`;
      let score = "";
      if (slugOf(e) === "pubg") {
        score = (e.participants || []).map(p => `<div class="sub">${esc(p.name)}${p.score ? " · " + esc(p.score) : ""}</div>`).join("");
      } else if (e.status !== "SCHEDULED" && scores.length === 2) {
        score = `<div class="score">${esc(scores[0])} : ${esc(scores[1])}</div>`;
      }
      const matchday = e.metadata?.matchday ? `Spieltag ${e.metadata.matchday}` : null;
      const sub = [e.metadata?.group, matchday, e.location].filter(Boolean)[0] || "";
      return `<article class="event-card ${hasPlaceholder ? "placeholder" : ""} ${e.status === "CANCELLED" ? "status-cancelled" : ""}" data-id="${e.id}" style="--mod:${color}">
        <div class="meta"><span>${esc(MOD_LABELS[slugOf(e)] || slugOf(e))}</span><span>${statusHtml || time}</span></div>
        <div class="title">${esc(e.title)}</div>
        ${score}
        ${sub ? `<div class="sub">${esc(sub)}</div>` : ""}
      </article>`;
    }

    function slugOf(e) {
      return { BUNDESLIGA_1: "bl1", BUNDESLIGA_2: "bl2", HANDBALL: "handball", PUBG: "pubg", F1: "f1", WORLD_CUP: "wm", NEWS: "news" }[e.moduleType] || e.moduleType;
    }

    // ── SSE: Live-Refresh für die sichtbare Woche ───────────────────────────
    function connectSse() {
      if (state.sse) state.sse.close();
      const params = new URLSearchParams({ week: state.week });
      if (state.code) params.set("code", state.code);
      const sse = new EventSource("/api/calendar/stream?" + params);
      sse.addEventListener("refresh", () => loadWeek(false));
      state.sse = sse;
    }

    // ── Drawer (Details) ────────────────────────────────────────────────────
    async function openDrawer(id) {
      const res = await fetch(`/api/events/${id}/details`);
      if (!res.ok) return;
      const det = await res.json();
      const ev = state.data.events.find(e => e.id === id);
      document.getElementById("drawer-mod").textContent = MOD_LABELS[det.module] || det.module;
      document.getElementById("drawer-title").textContent = det.title;
      const body = document.getElementById("drawer-body");
      let html = "";
      if (ev?.startTime) {
        const dt = new Intl.DateTimeFormat("de-DE", { dateStyle: "full", timeStyle: "short", timeZone: "Europe/Berlin" }).format(new Date(ev.startTime));
        html += `<p style="font-size:0.75rem;color:var(--color-text-secondary)">${esc(dt)}${ev.location ? " · " + esc(ev.location) : ""}</p>`;
      }
      if (det.matchEvents) {
        html += `<h3>Spielverlauf</h3>` + det.matchEvents.map(m =>
          `<div class="evt-line"><span class="min">${esc(m.minute)}</span><span>${esc([m.player, m.detail].filter(Boolean).join(" – ") || m.type)}</span></div>`).join("");
      }
      if (det.standings) {
        const hasGroups = det.standings.some(s => s.group);
        html += `<h3>Tabelle</h3><table><tr><th>#</th><th>Team</th><th class="num">Sp</th><th class="num">Diff</th><th class="num">Pkt</th></tr>` +
          det.standings.map(s =>
            `<tr class="${s.highlight ? "hl" : ""}"><td>${s.position}</td><td>${hasGroups && s.group ? esc(s.group) + " · " : ""}${esc(s.team)}</td><td class="num">${s.played}</td><td class="num">${s.goalsFor - s.goalsAgainst}</td><td class="num">${s.points}</td></tr>`).join("") + "</table>";
      }
      if (det.headToHead) {
        html += `<h3>Direkter Vergleich</h3><table><tr><th>Datum</th><th>Paarung</th><th class="num">Erg.</th></tr>` +
          det.headToHead.map(h => `<tr><td>${esc(h.date)}</td><td>${esc(h.home)} – ${esc(h.away)}</td><td class="num">${esc(h.result)}</td></tr>`).join("") + "</table>";
      }
      if (det.topScorers) {
        html += `<h3>Torschützen (Turnier)</h3><table><tr><th>#</th><th>Spieler</th><th class="num">Tore</th><th class="num">Assists</th></tr>` +
          det.topScorers.map(s => `<tr><td>${s.rank}</td><td>${esc(s.player)} <small style="color:var(--color-text-muted)">${esc(s.team)}</small></td><td class="num">${s.goals}</td><td class="num">${s.assists ?? "–"}</td></tr>`).join("") + "</table>";
      }
      if (det.driverStandings) {
        html += `<h3>Fahrerwertung</h3><table><tr><th>#</th><th>Fahrer</th><th class="num">Pkt</th></tr>` +
          det.driverStandings.slice(0, 10).map(s => `<tr><td>${s.position}</td><td>${esc(s.name)} <small style="color:var(--color-text-muted)">${esc(s.team ?? "")}</small></td><td class="num">${s.points}</td></tr>`).join("") + "</table>";
      }
      if (det.constructorStandings) {
        html += `<h3>Konstrukteurswertung</h3><table><tr><th>#</th><th>Team</th><th class="num">Pkt</th></tr>` +
          det.constructorStandings.slice(0, 10).map(s => `<tr><td>${s.position}</td><td>${esc(s.name)}</td><td class="num">${s.points}</td></tr>`).join("") + "</table>";
      }
      let pubgDay = null;
      if (det.pubgStats) {
        pubgDay = ev?.startTime ? new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Berlin" }).format(new Date(ev.startTime)) : null;
        html += `<h3>Tagesstatistik</h3><table><tr><th>Spieler</th><th class="num">Platz</th><th class="num">Kills</th><th class="num">Dmg</th><th class="num">Überlebt</th></tr>` +
          det.pubgStats.map(s => `<tr${s.playerId ? ` class="clickable" data-player-id="${esc(s.playerId)}" data-player-name="${esc(s.player)}"` : ""}><td>${esc(s.player)}</td><td class="num">#${s.placement}</td><td class="num">${s.kills}</td><td class="num">${s.damage}</td><td class="num">${s.survivedMinutes}min</td></tr>`).join("") + "</table>";
        if (pubgDay) html += `<p style="font-size:0.72rem;color:var(--color-text-muted);margin-top:0.25rem">Spieler antippen für Wochenstatistik &amp; Rekorde</p>`;
      }
      if (!html) html = `<p style="color:var(--color-text-muted);font-size:0.8rem">Für dieses Event liegen keine Detaildaten vor.</p>`;
      html += `<a class="ics-link hdr-btn" href="/api/events/${id}.ics">📅 In Kalender speichern</a>`;
      body.innerHTML = html;
      if (pubgDay) {
        body.querySelectorAll("tr[data-player-id]").forEach(row =>
          row.addEventListener("click", () => openPubgPlayerDetail(row.dataset.playerId, row.dataset.playerName, pubgDay, html)));
      }
      document.getElementById("drawer").classList.add("open");
      document.getElementById("drawer-backdrop").classList.add("open");
    }

    // ── PUBG-Spielerdetail (dritte Drawer-Ebene: Wochenstatistik + Rekorde) ──
    async function openPubgPlayerDetail(playerId, playerName, day, dayHtml) {
      const res = await fetch(`/api/pubg/player/${encodeURIComponent(playerId)}?day=${encodeURIComponent(day)}`);
      if (!res.ok) return;
      const det = await res.json();
      const body = document.getElementById("drawer-body");
      document.getElementById("drawer-title").textContent = playerName;
      let html = `<a class="back-link" href="#" id="pubg-back">← Zurück zur Tagesübersicht</a>`;
      const w = det.weekStats;
      if (w) {
        html += `<h3>Wochenstatistik</h3><table>
          <tr><td>Matches</td><td class="num">${w.matchesPlayed}</td></tr>
          <tr><td>Siege</td><td class="num">${w.wins}</td></tr>
          <tr><td>Top 10</td><td class="num">${w.top10}</td></tr>
          <tr><td>Kills gesamt</td><td class="num">${w.totalKills}</td></tr>
          <tr><td>Assists gesamt</td><td class="num">${w.totalAssists}</td></tr>
          <tr><td>Ø Schaden/Match</td><td class="num">${w.avgDamagePerMatch.toFixed(0)}</td></tr>
          <tr><td>Beste Tagesausbeute</td><td class="num">${w.bestDayKills} Kills</td></tr>
        </table>`;
      }
      const r = det.records;
      if (r) {
        html += `<h3>Persönliche Rekorde</h3><table>
          <tr><td>Meiste Kills (Match)</td><td class="num">${r.mostKillsInMatch}</td></tr>
          <tr><td>Weitester Kill</td><td class="num">${r.longestKillEver.toFixed(0)}m</td></tr>
          <tr><td>Längstes Überleben</td><td class="num">${Math.round(r.longestSurvivalEver / 60)}min</td></tr>
          <tr><td>Meister Schaden (Match)</td><td class="num">${r.mostDamageInMatch.toFixed(0)}</td></tr>
          <tr><td>Chicken Dinners</td><td class="num">${r.totalChickenDinners}</td></tr>
          <tr><td>Meiste Assists (Match)</td><td class="num">${r.mostAssistsInMatch}</td></tr>
          <tr><td>Beste Kill-Streak</td><td class="num">${r.bestKillStreak}</td></tr>
        </table>`;
      }
      if (!w && !r) html += `<p style="color:var(--color-text-muted);font-size:0.8rem">Keine Daten für diesen Spieler.</p>`;
      body.innerHTML = html;
      document.getElementById("pubg-back").addEventListener("click", e => {
        e.preventDefault();
        body.innerHTML = dayHtml;
        document.getElementById("drawer-title").textContent = "PUBG";
        body.querySelectorAll("tr[data-player-id]").forEach(row =>
          row.addEventListener("click", () => openPubgPlayerDetail(row.dataset.playerId, row.dataset.playerName, day, dayHtml)));
      });
    }

    function closeDrawer() {
      document.getElementById("drawer").classList.remove("open");
      document.getElementById("drawer-backdrop").classList.remove("open");
    }

    // ── Wetter-Drawer ───────────────────────────────────────────────────────
    async function openWeatherDrawer(location, day) {
      const res = await fetch(`/api/weather/${encodeURIComponent(location)}/${encodeURIComponent(day)}`);
      if (!res.ok) return;
      const det = await res.json();
      document.getElementById("drawer-mod").textContent = `Wetter · ${esc(det.location)}`;
      const dateParts = day.split("-");
      const dateLabel = new Intl.DateTimeFormat("de-DE", { weekday: "long", day: "numeric", month: "long" }).format(
        new Date(`${day}T12:00:00`)
      );
      document.getElementById("drawer-title").textContent = dateLabel;
      const body = document.getElementById("drawer-body");
      // Kopfzeile
      let html = `<p style="font-size:1.4rem;margin-bottom:0.25rem">${esc(det.symbol)}</p>`;
      html += `<p style="font-size:0.85rem;color:var(--color-text-secondary);margin-bottom:0.75rem">${esc(det.label)}</p>`;
      html += `<p style="font-size:0.8rem;margin-bottom:0.5rem">Max ${det.tempMax}° · Min ${det.tempMin}°</p>`;
      html += `<p style="font-size:0.72rem;color:var(--color-text-muted)">☀ ${esc(det.sunrise)} Aufgang · ${esc(det.sunset)} Untergang</p>`;
      // Stundenverlauf
      if (det.hours && det.hours.length > 0) {
        const maxTemp = Math.max(...det.hours.map(h => h.temp));
        const minTemp = Math.min(...det.hours.map(h => h.temp));
        const tempRange = maxTemp - minTemp || 1;
        html += `<h3>Stundenverlauf (06–24 Uhr)</h3>`;
        html += `<div class="weather-bar">` + det.hours.map(h => {
          const barH = Math.round(8 + ((h.temp - minTemp) / tempRange) * 40);
          return `<div class="weather-bar-col">
            <div class="wh-rain">${h.precipProbability > 0 ? h.precipProbability + "%" : ""}</div>
            <div class="wh-bar" style="height:${barH}px" title="${h.temp}°"></div>
            <span>${h.hour}h</span>
          </div>`;
        }).join("") + `</div>`;
      }
      // Kennzahlen
      html += `<div class="weather-kpi">
        <div><dt>Niederschlag</dt><dd>${det.precipSumMm.toFixed(1)} mm</dd></div>
        <div><dt>Wind max.</dt><dd>${det.windMaxKmh.toFixed(0)} km/h</dd></div>
      </div>`;
      body.innerHTML = html;
      document.getElementById("drawer").classList.add("open");
      document.getElementById("drawer-backdrop").classList.add("open");
    }

    // ── Konfigurator ────────────────────────────────────────────────────────
    async function openConfig() {
      document.getElementById("modal-backdrop").classList.add("open");
      if (!state.catalog) {
        const res = await fetch("/api/catalog");
        state.catalog = await res.json();
      }
      const current = {};
      if (state.code && state.data?.code) {
        try {
          const cfg = await (await fetch(`/api/config/${state.code}`)).json();
          (cfg.selections || []).forEach(s => current[s.module] = s.refs || []);
        } catch (_) { /* Code nicht mehr gültig */ }
      }
      document.getElementById("modal-body").innerHTML = state.catalog.modules.map(m => {
        const on = m.module in current;
        const selected = new Set(current[m.module] || []);
        const isRadio = m.module === "weather";
        const options = m.options.map(o => {
          if (isRadio) {
            return `<label><input type="radio" name="weather-loc" data-ref="${esc(o.ref)}" ${selected.has(o.ref) ? "checked" : ""}> ${esc(o.label)}</label>`;
          }
          return `<label><input type="checkbox" data-ref="${esc(o.ref)}" ${selected.has(o.ref) ? "checked" : ""}> ${esc(o.label)}</label>`;
        }).join("");
        const hint = isRadio ? "Genau ein Ort (Einfachauswahl)" : `Ohne Auswahl: alle ${esc(m.label)}-Termine`;
        return `<div class="cfg-module ${on ? "on" : ""}" data-module="${m.module}">
          <label><input type="checkbox" class="mod-toggle" ${on ? "checked" : ""}> <b>${esc(m.label)}</b></label>
          ${m.selectableRefs && m.options.length ? `<div class="cfg-hint">${hint}</div><div class="cfg-options">${options}</div>` : ""}
        </div>`;
      }).join("");
      document.querySelectorAll(".mod-toggle").forEach(t =>
        t.addEventListener("change", () => t.closest(".cfg-module").classList.toggle("on", t.checked)));
      document.getElementById("cfg-result").innerHTML = "";
    }

    async function createCode() {
      const selections = [...document.querySelectorAll(".cfg-module")]
        .filter(m => m.querySelector(".mod-toggle").checked)
        .map(m => {
          const checked = [...m.querySelectorAll(".cfg-options input:checked")].map(i => i.dataset.ref);
          // WEATHER: Radio-Verhalten – genau einen Ort als ref, wenn keiner angekreuzt → überspringen
          if (m.dataset.module === "weather" && checked.length === 0) return null;
          return { module: m.dataset.module, refs: checked };
        }).filter(Boolean);
      if (!selections.length) {
        document.getElementById("cfg-result").textContent = "Bitte mindestens ein Modul wählen.";
        return;
      }
      const res = await fetch("/api/config", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ selections })
      });
      if (!res.ok) {
        document.getElementById("cfg-result").textContent = "Fehler beim Erzeugen.";
        return;
      }
      const cfg = await res.json();
      document.getElementById("cfg-result").innerHTML = `Dein Code: <b>${esc(cfg.code)}</b> – gespeichert & aktiv.`;
      applyCode(cfg.code);
    }

    function applyCode(code) {
      state.code = code.toUpperCase();
      localStorage.setItem("noonoo-code", state.code);
      loadWeek();
    }

    // ── News-Ticker ─────────────────────────────────────────────────────────
    let tickerItems = [], tickerIdx = 0;
    async function loadTicker() {
      try {
        tickerItems = await (await fetch("/api/news?limit=20")).json();
      } catch (_) { tickerItems = []; }
      rotateTicker();
    }
    function rotateTicker() {
      if (!tickerItems.length) return;
      const item = tickerItems[tickerIdx % tickerItems.length];
      tickerIdx++;
      document.getElementById("ticker-src").textContent = item.source;
      const a = document.getElementById("ticker-item");
      a.textContent = item.title;
      a.href = item.url;
    }

    // ── Events & Init ───────────────────────────────────────────────────────
    document.getElementById("prev-week").onclick = () => { state.week = state.data.prevWeek; loadWeek(); };
    document.getElementById("next-week").onclick = () => { state.week = state.data.nextWeek; loadWeek(); };
    document.getElementById("today-btn").onclick = () => { state.week = null; loadWeek(); };
    document.getElementById("drawer-close").onclick = closeDrawer;
    document.getElementById("drawer-backdrop").onclick = closeDrawer;
    document.getElementById("open-config").onclick = openConfig;
    document.getElementById("modal-close").onclick = () => document.getElementById("modal-backdrop").classList.remove("open");
    document.getElementById("modal-backdrop").addEventListener("click", e => {
      if (e.target === e.currentTarget) e.currentTarget.classList.remove("open");
    });
    document.getElementById("create-code").onclick = createCode;
    document.getElementById("apply-code").onclick = () => {
      const code = document.getElementById("code-input").value.trim();
      if (code) { applyCode(code); document.getElementById("modal-backdrop").classList.remove("open"); }
    };
    document.getElementById("code-input").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("apply-code").click();
    });
    window.addEventListener("popstate", () => {
      const params = new URLSearchParams(location.search);
      state.week = params.get("week");
      state.code = params.get("code");
      loadWeek(false);
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeDrawer(); document.getElementById("modal-backdrop").classList.remove("open"); }
      if (e.key === "ArrowLeft" && state.data) { state.week = state.data.prevWeek; loadWeek(); }
      if (e.key === "ArrowRight" && state.data) { state.week = state.data.nextWeek; loadWeek(); }
    });

    loadWeek(false);
    loadTicker();
    setInterval(rotateTicker, 8000);
    setInterval(loadTicker, 5 * 60_000);
  </script>
</body>
</html>
